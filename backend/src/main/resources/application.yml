spring:
  application:
    name: proofpay
  config:
    # Local dev: read secrets from the repo-root .env (never committed)
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    # Local: DB_URL. Render: DB_HOST/DB_PORT/DB_NAME from the managed database.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:proofpay}}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  platform-email: ${PAYPAL_PLATFORM_EMAIL:}
  webhook-id: ${PAYPAL_WEBHOOK_ID:}
  return-url: ${APP_BASE_URL:http://localhost:3000}/fund/return
  cancel-url: ${APP_BASE_URL:http://localhost:3000}/fund/cancel

proofpay:
  # Required header X-Api-Key on /api/** (except webhooks). Empty = open, local dev only.
  api-key: ${PROOFPAY_API_KEY:}
  ai-rate-limit:
    per-ip: ${AI_RATE_LIMIT_PER_IP:20}
    global: ${AI_RATE_LIMIT_GLOBAL:120}
  # Dev/test only: POST /api/milestones/{id}/propose-release (caller-stated confidence). Keep false when hosted.
  manual-release-enabled: ${MANUAL_RELEASE_ENABLED:false}
  # Backup for webhooks: how often to re-check pending captures and payouts
  poll-interval-ms: 30000
  ai:
    openai-api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}
    # Only for reasoning models (gpt-5*, o*); leave blank for gpt-4.1 etc.
    reasoning-effort: ${OPENAI_REASONING_EFFORT:minimal}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:120}
    github-token: ${GITHUB_TOKEN:}
    # Reuse identical AI answers (same job text / same commit + criteria + model). Gate still runs.
    cache-enabled: ${AI_CACHE_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
