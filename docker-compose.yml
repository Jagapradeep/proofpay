services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proofpay
      POSTGRES_USER: proofpay
      POSTGRES_PASSWORD: proofpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofpay"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
